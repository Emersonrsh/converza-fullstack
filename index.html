  .tokens .n{font-weight:800;color:#fff}
  .tokens small{color:var(--sidebar-muted);font-size:11px}

  .main{display:flex;flex-direction:column;min-width:0;overflow:hidden}

  .topbar .sub{color:var(--muted);font-size:12.5px;font-weight:600}
  .spacer{flex:1}
  .content{overflow-y:auto;padding:22px;min-height:0}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
  .card.pad{padding:18px}
  .row{display:flex;align-items:center;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:700;font-size:13.5px;cursor:pointer;transition:all .13s;white-space:nowrap}

  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{background:var(--primary-600);border-color:var(--primary-600)}
  .btn.ghost{border-color:transparent;background:transparent}
  .btn.ghost:hover{background:var(--surface-2)}
  .btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
  .btn.icon{width:38px;padding:0;justify-content:center}
  .btn.icon.sm{width:32px}
  .pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:30px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted)}
  .pill.dot:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .pill.green{background:var(--success-50);color:var(--success)}
  .pill.amber{background:var(--accent-50);color:var(--accent)}
  .pill.red{background:var(--danger-50);color:var(--danger)}
  .pill.blue{background:var(--info-50);color:var(--info)}
  .pill.teal{background:var(--primary-50);color:var(--primary)}

  .input:focus,.select:focus,textarea.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
  .label{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;display:block}
  .grid{display:grid;gap:16px}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}
  .hr{height:1px;background:var(--border);border:0;margin:0}
  .avatar{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}
  .chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
  .chip.active{background:var(--primary-50);border-color:var(--primary);color:var(--primary)}
  .seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;height:30px;padding:0 13px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer}
  .seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border)}
  td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13.5px;font-weight:500}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  .title{font-size:15px;font-weight:800;letter-spacing:-.01em}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{padding:16px}
  .kpi .top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12.5px;font-weight:700}
  .kpi .val{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:10px}
  .kpi .delta{font-size:12px;font-weight:700;margin-top:4px}
  .up{color:var(--success)} .down{color:var(--danger)}
  .modal-bg{position:fixed;inset:0;background:rgba(8,18,20,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:88vh;overflow:auto}

  .modal .mb{padding:20px}
  .modal .mf{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--border)}
  .empty{text-align:center;color:var(--faint);padding:40px 20px;font-weight:600}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .switch{width:40px;height:23px;border-radius:30px;background:var(--border-strong);position:relative;cursor:pointer;transition:background .15s;flex:none}
  .switch.on{background:var(--primary)}
  .switch i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .switch.on i{left:19px}
  .progress{height:8px;border-radius:20px;background:var(--surface-3);overflow:hidden}
  .progress i{display:block;height:100%;background:var(--primary);border-radius:20px}
  @media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{display:none}.kpi-grid{grid-template-columns:repeat(2,1fr)}}
</style>

/* ---------- tiny chart components ---------- */
function AreaChart({data,height=180,color='var(--primary)'}){
  const w=720,h=height,pad=10;
  const max=Math.max(...data,1);
  const step=(w-pad*2)/(data.length-1);
  const pts=data.map((v,i)=>[pad+i*step, h-pad-(v/max)*(h-pad*2-14)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${pts[pts.length-1][0].toFixed(1)} ${h-pad} L ${pts[0][0].toFixed(1)} ${h-pad} Z`;
  const gid='g'+Math.random().toString(36).slice(2,7);
  return html`<svg viewBox=${`0 0 ${w} ${h}`} width="100%" height=${h} preserveAspectRatio="none" style="display:block">
    <defs><linearGradient id=${gid} x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color=${color} stop-opacity="0.28"/><stop offset="100%" stop-color=${color} stop-opacity="0"/>
    </linearGradient></defs>
    ${[0.25,0.5,0.75,1].map(f=>html`<line x1=${pad} x2=${w-pad} y1=${(h-pad*2-14)*f+pad} y2=${(h-pad*2-14)*f+pad} stroke="var(--border)" stroke-width="1"/>`)}
    <path d=${area} fill=${`url(#${gid})`}/>
    <path d=${line} fill="none" stroke=${color} stroke-width="2.5"/>
    ${pts.filter((_,i)=>i%2===0).map(p=>html`<circle cx=${p[0]} cy=${p[1]} r="2.6" fill=${color}/>`)}
  </svg>`;
}
function Bars({data,labels,height=180,color='var(--primary)'}){
  const max=Math.max(...data,1);
  return html`<div style="display:flex;align-items:flex-end;gap:3px;height:${height}px;padding-top:10px">
    ${data.map((v,i)=>html`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end">
      <div title=${v} style=${`width:100%;max-width:16px;border-radius:5px 5px 0 0;background:${v?color:'var(--surface-3)'};height:${Math.max(3,(v/max)*100)}%;transition:height .4s`}></div>
      ${labels&&i%3===0?html`<span style="font-size:9.5px;color:var(--faint);font-weight:600">${labels[i]}</span>`:html`<span style="font-size:9.5px">&nbsp;</span>`}
    </div>`)}
  </div>`;
}

function FlowBuilder({back,toast}){
  const [nodes,setNodes]=useState(FLOW_NODES);
  const drag=useRef(null);
  const onDown=(id,e)=>{const n=nodes.find(x=>x.id===id);drag.current={id,dx:e.clientX-n.x,dy:e.clientY-n.y};};
  const onMove=e=>{if(!drag.current)return;const{id,dx,dy}=drag.current;setNodes(ns=>ns.map(n=>n.id===id?{...n,x:Math.max(0,e.clientX-dx),y:Math.max(0,e.clientY-dy)}:n));};
  const up=()=>drag.current=null;
  const center=n=>[n.x+95,n.y+34];
  const palette=[['Mensagem','#8b5cf6'],['Condição','var(--accent)'],['IA','var(--primary)'],['Ação','var(--success)'],['Espera','var(--info)']];
  return html`<div class="fade card" style="height:calc(100vh - 104px);display:flex;flex-direction:column;overflow:hidden;padding:0">
    <div class="row" style="padding:12px 16px;border-bottom:1px solid var(--border)">
      <button class="btn sm ghost" onClick=${back}>← Voltar</button>
      <input class="input" value="Boas-vindas + qualificação" style="max-width:300px;font-weight:700"/>
      <div class="spacer"></div>
      <span class="pill green dot">rascunho salvo</span>
      <button class="btn sm" onClick=${()=>toast('Testar fluxo')}><${Icon} name="play" size=${14}/>Testar</button>
      <button class="btn primary sm" onClick=${()=>toast('Fluxo publicado')}>Publicar</button>
    </div>
    <div style="flex:1;display:grid;grid-template-columns:200px 1fr;min-height:0">
      <div style="border-right:1px solid var(--border);padding:14px;overflow-y:auto">
        <div class="label">Blocos</div>
        ${palette.map(([t,c])=>html`<div class="card pad" draggable=${true} onClick=${()=>toast('Arraste '+t+' para o canvas')} style="padding:10px 12px;margin-bottom:8px;cursor:grab;display:flex;align-items:center;gap:9px">
          <span style=${`width:9px;height:9px;border-radius:3px;background:${c}`}></span><b style="font-size:12.5px">${t}</b></div>`)}
      </div>
      <div onMouseMove=${onMove} onMouseUp=${up} onMouseLeave=${up} style="position:relative;overflow:auto;background:
        radial-gradient(circle at center, var(--border) 1px, transparent 1px);background-size:22px 22px;min-height:100%">
        <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
          ${FLOW_EDGES.map(([a,b])=>{const na=nodes.find(n=>n.id===a),nb=nodes.find(n=>n.id===b);const[x1,y1]=center(na),[x2,y2]=center(nb);const mx=(x1+x2)/2;return html`<path d=${`M${x1+95} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2-95} ${y2}`} stroke="var(--border-strong)" stroke-width="2" fill="none" marker-end="url(#arr)"/>`;})}
          <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="var(--border-strong)"/></marker></defs>
        </svg>
        ${nodes.map(n=>html`<div onMouseDown=${e=>onDown(n.id,e)} style=${`position:absolute;left:${n.x}px;top:${n.y}px;width:190px;background:var(--surface);border:1px solid var(--border);border-left:3px solid ${n.color};border-radius:12px;box-shadow:var(--shadow);padding:11px 13px;cursor:grab;user-select:none`}>
          <div class="row" style="gap:7px;margin-bottom:5px"><span style=${`font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:${n.color}`}>${n.type}</span></div>
          <b style="font-size:13px">${n.title}</b>
        </div>`)}
      </div>
    </div>
  </div>`;
}

  const Page=PAGES[route]||Dashboard;
  return html`<div class="shell">
    <${Sidebar} route=${route} go=${go} theme=${theme} setTheme=${setTheme}/>
    <div class="main">
      <${Topbar} route=${route} toast=${toast}/>
      <div class="content"><${Page} toast=${toast}/></div>
    </div>
    ${toastMsg&&html`<div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;font-size:13px;box-shadow:var(--shadow-lg);z-index:80" class="fade">${toastMsg}</div>`}
  </div>`;
}
render(html`<${App}/>`, document.getElementById('app'));
</script>
</body>
</html>
